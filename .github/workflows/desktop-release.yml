# Builds the desktop installers and attaches them to a GitHub Release.
# Trigger: push a tag like v1.0.0  (git tag v1.0.0 && git push origin v1.0.0)
# The website's download buttons point at releases/latest/download/<file> — set DOWNLOAD_BASE when building the site.
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15            # Apple Silicon
            task: packageReleaseDmg
            glob: app/build/compose/binaries/main-release/dmg/*.dmg
            name: HTML-Lens-mac-arm64.dmg
          - os: macos-15-intel      # Intel
            task: packageReleaseDmg
            glob: app/build/compose/binaries/main-release/dmg/*.dmg
            name: HTML-Lens-mac-intel.dmg
          - os: windows-latest
            task: packageReleaseMsi
            glob: app/build/compose/binaries/main-release/msi/*.msi
            name: HTML-Lens-windows.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installer
        shell: bash
        env:
          DESKTOP_JAVA_HOME: ${{ env.JAVA_HOME }}
          # Optional signing (macOS). Leave unset to build unsigned installers.
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || VERSION=1.0.0
          ./gradlew :app:${{ matrix.task }} -PappVersion=$VERSION --no-daemon
          mkdir -p out && cp ${{ matrix.glob }} "out/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
