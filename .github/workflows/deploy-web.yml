# Builds the web app + website and deploys both Workers to Cloudflare.
# Needs repository secrets: CLOUDFLARE_API_TOKEN (Workers edit) and CLOUDFLARE_ACCOUNT_ID.
# Optional variable DOWNLOAD_BASE, e.g. https://github.com/<you>/html-lens/releases/latest/download
name: Deploy website

# Manual for now; switch to `push: branches: [main]` once the secrets above are added.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:wasmJsBrowserDistribution --no-daemon
        env:
          DESKTOP_JAVA_HOME: ${{ env.JAVA_HOME }}
      - run: node deploy/deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOWNLOAD_BASE: ${{ vars.DOWNLOAD_BASE }}
